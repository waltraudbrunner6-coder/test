name: Swift Domain and Persistence Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  swift-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Compile and run domain and persistence tests
        run: swift test
      - name: Build native macOS app
        run: >-
          xcodebuild
          -project PoliticalFactCheckApp.xcodeproj
          -scheme PoliticalFactCheckApp
          -destination 'platform=macOS,arch=arm64'
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build
